<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SealGuard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='3' fill='none' stroke='%23f2a93b' stroke-width='3'/%3E%3Cpath d='M9 16h14' stroke='%232fbf9b' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="3" fill="none" stroke="var(--amber)" stroke-width="2.5"/><path d="M8 16h16" stroke="var(--ok)" stroke-width="2.5"/><circle cx="16" cy="16" r="3" fill="var(--amber)"/></svg>
      <div><div class="brand-name">SealGuard</div><div class="brand-sub">Agentic Quality Ops</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu" id="menu" aria-label="Menu">☰</button>
      <div class="status-strip" id="status-strip"></div>
      <label class="operator">Operator <input id="operator" placeholder="your name" autocomplete="off"></label>
    </header>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="drawer-bg" id="drawer-bg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
